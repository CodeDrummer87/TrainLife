spring:
  application:
    name: trainlife

  datasource:
    url: jdbc:postgresql://localhost:5434/trainlife_db
    username: postgres
    password: postgres

  flyway:
    enabled: true
    locations: classpath:db.migration

  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: src/main/resources/static/images/uploads
